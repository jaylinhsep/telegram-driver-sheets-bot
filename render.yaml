services:
  - type: web
    name: telegram-driver-sheets-bot
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:web_app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GOOGLE_SHEET_ID
        value: 13ndQsSmBsKlHjIRQR0S0MO5BPqqL6J4CECBAYfQi1oo
      - key: GOOGLE_SHEET_TAB_DATA
        value: DanhSachXe
      - key: GOOGLE_SHEET_TAB_VENDOR
        value: VENDOR
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: ALLOWED_CHAT_IDS
        sync: false
